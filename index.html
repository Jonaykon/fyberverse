* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: 'Main', monospace;
    font-size: 24px;
}

body {
    overflow: hidden;
}

#terminal {
    width: 100%;
    height: 100%;
    padding: 16px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #fff transparent;
    white-space: pre-wrap;
    word-break: break-word;
    display: flex;
    flex-direction: column;
}

#terminal::-webkit-scrollbar {
    width: 3px;
}

#terminal::-webkit-scrollbar-track {
    background: transparent;
}

#terminal::-webkit-scrollbar-thumb {
    background: #fff;
}

#output {
    line-height: 1.2;
    margin: 0;
    padding: 0;
}

#input-line {
    display: flex;
    align-items: flex-start;
    line-height: 1.2;
    min-height: 1.2em;
    margin: 0;
    padding: 0;
}

#prompt {
    flex-shrink: 0;
}

#command {
    outline: none;
    border: none;
    padding: 0;
    margin: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    white-space: pre-wrap;
    word-break: break-word;
    min-width: 1px;
    caret-color: currentColor;
}
    </style>
</head>

<body>
    <div id="terminal">
        <div id="output"></div>

        <div id="input-line">
            <span id="prompt">&gt;&nbsp;</span>
            <span id="command" contenteditable="true" spellcheck="false"></span>
        </div>
    </div>

    <script src="main.js"></script>
</body>

</html>
